name: Android CI

# Builds the APK, runs unit tests and lint on every push / pull request.
# This workflow runs on GitHub-hosted runners which have full network access
# to Google Maven and the Gradle distribution server.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee /tmp/gradle-build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --console=plain 2>&1 | tee /tmp/gradle-test.log

      - name: Run lint
        run: |
          set -o pipefail
          ./gradlew lintDebug --console=plain 2>&1 | tee /tmp/gradle-lint.log

      - name: Report errors in job summary and annotations
        if: failure()
        run: |
          for f in /tmp/gradle-build.log /tmp/gradle-test.log /tmp/gradle-lint.log; do
            if [ -f "$f" ]; then
              echo "### Errors from $f" >> "$GITHUB_STEP_SUMMARY"
              grep -E "^e: |error:|error |FAILURE:|What went wrong|Caused by|> " "$f" | head -40 | tee -a "$GITHUB_STEP_SUMMARY" | while IFS= read -r line; do
                echo "::error::${line}"
              done
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/**
