name: Attach APKs to release

# Fast workflow (no build): the APKs are committed under dist/ on the branch,
# so this job just attaches them to a GitHub Release for public download links.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the APKs to
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  attach:
    name: Attach dist/*.apk to release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload APKs to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist/
          gh release upload "${{ inputs.tag }}" dist/*.apk --clobber
          gh release view "${{ inputs.tag }}" --json assets -q '.assets[] | .name + " -> " + .url'
