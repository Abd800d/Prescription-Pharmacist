name: Attach APKs to release

# Fast workflow (no build): the APKs are committed under dist/ on the branch,
# so this job just attaches them to a GitHub Release for public download links.
# Trigger: push a commit whose message contains [attach-apk] (works on any
# branch), or run manually via workflow_dispatch when available.
on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the APKs to
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  attach:
    name: Attach dist/*.apk to release
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[attach-apk]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload APKs to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || 'v1.0.0' }}
        run: |
          ls -la dist/
          gh release upload "$TAG" dist/*.apk --clobber
          gh release view "$TAG" --json assets -q '.assets[] | .name'
